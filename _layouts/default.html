<!DOCTYPE html>
<html lang="en">
  <head>
    {% include meta.html %}
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.name }}</title>
    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />
  </head>

  <body>
    <nav class="gnav" aria-label="Main">
      <div class="gnav-in">
        <a class="brand" href="{{ site.baseurl }}/">{{ site.name }}</a>
        <div class="gnav-links">
          <a href="{{ site.baseurl }}/"{% if page.url == "/" or page.layout == "post" %} aria-current="page"{% endif %}>Blog</a>
          <a href="{{ site.baseurl }}/projects/"{% if page.url contains "/projects/" %} aria-current="page"{% endif %}>Projects</a>
          <a href="{{ site.baseurl }}/about/"{% if page.url == "/about/" %} aria-current="page"{% endif %}>About</a>
        </div>
      </div>
    </nav>

    <main id="main" role="main">
      {{ content }}
    </main>

    <footer class="gfoot">
      <div class="gfoot-in">
        <div class="gfoot-icons">{% include svg-icons.html %}</div>
        <p>{{ site.name }} · {{ site.description }}</p>
        <p>© {{ site.time | date: "%Y" }} Soyoun Son</p>
      </div>
    </footer>

    {% include analytics.html %}
  </body>
</html>
