bio:
  - >-
    I'm an applied scientist and data scientist working where engineering, physics and
    computer science meet. I design end-to-end pipelines, from feature engineering to
    statistical, machine learning and deep learning models, and I care most about whether
    the output changes a decision.
  - >-
    I've built my career across Switzerland, the USA, Italy, France and South Korea.
    Wherever I work, I start from the problem the customer actually needs solved, then
    choose the method that fits it and deliver results, insights and value they can use.
  - >-
    Most recently I've worked on battery fire diagnosis and battery degradation prediction.
    Fire diagnosis is a rare-event problem where a missed warning costs far more than a false
    alarm; degradation prediction asks how a battery will age long before it does. Both start
    from incomplete, noisy data. My side project
    <a href="/projects/sharkguard/">SharkGuard</a> applies the same thinking to shark risk on
    the California coast.

focus:
  - title: Battery fire diagnosis
    text: Spotting the early signs of rare thermal events in battery data, where a missed warning costs far more than a false alarm.
  - title: Battery degradation prediction
    text: Forecasting how battery health and capacity fade over time, so problems can be planned for before they happen.
  - title: Rare-event risk
    text: Scoring events that almost never happen, with honest uncertainty and validation on held-out data.
  - title: End-to-end ML pipelines
    text: From raw engineering and sensor data through feature engineering to models, evaluation and tools people use every day.

