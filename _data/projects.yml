# Projects shown on /projects/ and the home page (newest first).
# To add a project: copy one block, add a screenshot under images/projects/,
# and (optional) a case-study page under projects/<slug>.md with layout: project.

- slug: sharkguard
  title: SharkGuard California
  tagline: Seasonal shark risk for California beaches, before you surf, swim, dive or paddle.
  date: Nov 2026
  image: /images/projects/sharkguard-hero.jpg
  thumb: /images/projects/sharkguard-map.jpg
  summary: >-
    Pick a beach and a date to get a 0–100 seasonal risk score, nearby incidents and a relief
    map where real satellite-tagged sharks move with the season. Built on 202 CDFW incident
    records and TOPP tag tracks, framed as a rare-event risk problem.
  highlights:
    - Rare-event risk score from 72 years of incident records (2000+ used for scoring)
    - Real satellite-tag tracks for 63 white, salmon and thresher sharks
    - Relief map with seasonal rings, filters and light/dark themes
    - Real-time 3D white shark (three.js, GPU-animated)
  tags: [Rare-event risk, Geospatial data, Data visualization, Python, D3, Apache ECharts, three.js]
  live: https://soyounson.github.io/sharkguard/
  code: https://github.com/soyounson/sharkguard
  page: /projects/sharkguard/

- slug: chanterelle-hunting-spots
  title: Chanterelle hunting spots
  tagline: When and where golden chanterelles turn up in Europe, the USA and Canada, and how that lines up with rain.
  date: Nov 2026
  image: /images/projects/chanterelle-hero.jpg
  thumb: /images/projects/chanterelle-map.jpg
  summary: >-
    About 113,000 public GBIF records of golden chanterelles (Cantharellus) mapped by city and month
    across Europe, the USA and Canada, with rain contours, a fox that fills its bag in the busiest month,
    and monthly rain and temperature for each spot.
  highlights:
    - About 113,000 GBIF records counted in ~110 km grid cells and credited to nearby big cities
    - Country, city and month pickers zoom to 25 km around a city (Europe peaks Aug–Sep, coastal California in winter)
    - Rain contours from 86 weather stations blended by distance
    - Climate × fruiting charts per spot; next step is predicting each season from earlier weather
  tags: [Geospatial data, Ecology, Climate, Data visualization, Python, D3, Apache ECharts]
  live: https://soyounson.github.io/chanterelle-hunting-spots/
  code: https://github.com/soyounson/chanterelle-hunting-spots
  page: /projects/chanterelle-hunting-spots/

- slug: open-battery-data
  title: Open Battery Data
  tagline: Where open battery data comes from, on a globe, with what each dataset records and how to get it.
  date: Nov 2026
  image: /images/projects/open-battery-data-hero.jpg
  thumb: /images/projects/open-battery-data-thumb.jpg
  summary: >-
    A checked catalogue of 20 open datasets for battery degradation, thermal runaway and fire risk:
    EV field telemetry, lab cell cycling and abuse tests, and EV and ESS fire records. Each entry lists
    its signals, how and how often it was collected, slow or fast charging and C-rate, chemistry, scale and whether you can download it today.
  highlights:
    - 20 datasets in 4 groups, every value checked against the source (n/s where it isn't stated)
    - Signals and acquisition per dataset (BMS, CAN logger, charging station, lab cycler; 1 s to per-test)
    - Interactive globe with a detail panel, plus the same tables below it
    - One CSV drives the README and the site; a script downloads the 5 directly available datasets
  tags: [Data catalog, Battery, EV, Thermal runaway, Geospatial data, globe.gl, Python]
  live: https://soyounson.github.io/open-battery-data/
  code: https://github.com/soyounson/open-battery-data
  page: /projects/open-battery-data/
